<div class="action-box">
    <div class="section">
        <div class="icon icon-lock"></div>
        <div class="text">
            <div class="label">{% trans %}Passcode protection{% endtrans %}</div>
            {% if settings.is_enabled %}
                {% trans %}Enabled{% endtrans %}
            {% else %}
                {% trans %}Disabled{% endtrans %}
            {% endif %}
        </div>
        <div class="toolbar">
            <ind-plugin-regform-passcode-settings
                settings='{{ settings | tojson }}'
                require-login='{{ regform.require_login | tojson }}'
                save-url="{{ url_for('plugin_regform_passcode.manage', regform) }}"
                general-settings-url="{{ url_for('event_registration.edit_regform', regform) }}"
            ></ind-plugin-regform-passcode-settings>
        </div>
    </div>
</div>
